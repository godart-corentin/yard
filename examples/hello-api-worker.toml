# One Git revision and one image tag for the API and worker.
# `service = "api"` remains supported for single-service projects; do not set
# `service` and `services` together.
repo = "/srv/hello-api"
branch = "main"
remote = "origin"

[compose]
directory = "/srv/hello-api/deploy"
file = "docker-compose.yml"
env_file = ".env"
services = ["api", "worker"]

# Both Compose services must have build sections and distinct image names:
#   api:    image: hello-api:${HELLO_API_IMAGE_TAG:-local}
#   worker: image: hello-worker:${HELLO_API_IMAGE_TAG:-local}
[image]
name = "hello-api" # Retained for compatibility with existing manifests.
tag_env = "HELLO_API_IMAGE_TAG"

[deployment]
migration_service = "migrate"
health_url = "https://api.example.com/health"
health_attempts = 30
health_interval_seconds = 2
gate_attempts = 30 # Defaults to 30 attempts when omitted.
gate_interval_seconds = 2 # Defaults to 2 seconds between attempts.

# Status probes are independent of deployment.health_url. Omit a probe for
# explicit Unknown health. The CLI probes these; Web reads the CLI snapshot.
[service_health.api]
type = "http"
url = "https://api.example.com/health"
timeout_ms = 2000
deployment_gate = true # Optional; false by default. All gated probes must be Healthy.

# The worker must periodically `touch /run/yard/heartbeat` INSIDE its container.
# Keep this file in the container's ephemeral filesystem, not a persistent volume.
[service_health.worker]
type = "heartbeat"
path = "/run/yard/heartbeat"
max_age_seconds = 60
deployment_gate = true # Old heartbeats from before this release's startup do not count.

# Optional backup of persistent data before deployment/rollback.
[backup]
command = ["/usr/local/sbin/hello-api-backup"]
