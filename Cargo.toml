[package]
name = "yard"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A small deployment CLI for self-hosted Docker Compose projects"
license = "MIT"
repository = "https://github.com/godart-corentin/yard"
readme = "README.md"
keywords = ["homelab", "docker-compose", "deployment", "self-hosted", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
