name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - name: Web format
        run: cargo fmt --manifest-path web/Cargo.toml -- --check
      - name: Web clippy
        run: cargo clippy --manifest-path web/Cargo.toml --all-targets -- -D warnings
      - name: Web tests
        run: cargo test --manifest-path web/Cargo.toml --locked
      - name: Generated TypeScript API types are up to date
        run: |
          git diff --exit-code -- web/ui/src/api/types
          test -z "$(git status --porcelain -- web/ui/src/api/types)"
      - name: Installer tests
        run: node --test web/tests/*.test.mjs
      - name: Installer syntax
        run: bash -n install.sh install-web.sh uninstall-web.sh update.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
