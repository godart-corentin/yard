name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - name: Web format
        run: cargo fmt --manifest-path web/Cargo.toml -- --check
      - name: Web clippy
        run: cargo clippy --manifest-path web/Cargo.toml --all-targets -- -D warnings
      - name: Web tests
        run: cargo test --manifest-path web/Cargo.toml --locked
      - name: Installer syntax
        run: bash -n install.sh install-web.sh uninstall-web.sh update.sh
