<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Yard Status</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="brand">Yard <span>Status</span></div>
          <div class="muted">Deployment health from configured Yard projects</div>
        </div>
        <button id="refresh" class="refresh" type="button">Refresh</button>
      </header>

      <section id="summary" class="summary panel loading">
        <div>
          <div class="eyebrow">Overall status</div>
          <h1>Checking services…</h1>
        </div>
        <div id="summary-badge" class="badge pending">Checking</div>
      </section>

      <section>
        <div class="section-title">
          <h2>Projects</h2>
          <div id="checked-at" class="muted"></div>
        </div>
        <div id="projects" class="panel projects">
          <div class="empty">Loading Yard projects…</div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
